{% extends 'base.html' %}
{% load static %}

{% block title %}Register Applicant · Passport Management System{% endblock %}

{% block content %}
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">Passport Management System</span>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">Dashboard</a>
</nav>
<div class="container mt-5 pms-container-narrow">
    <h3 class="mb-4">Register New Applicant</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-3">Register Applicant</button>
    </form>
</div>
{% endblock %}
